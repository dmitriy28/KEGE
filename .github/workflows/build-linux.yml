name: Build Linux

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-pip \
            dpkg-dev binutils libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - uses: actions/checkout@v4
      - name: Build tar.gz and .deb
        run: ./build_linux.sh
      - name: Smoke test installed package
        env:
          QT_QPA_PLATFORM: offscreen
          KEGE_DATA_DIR: /tmp/kege-smoke
        run: |
          apt-get install -y ./dist/release/*.deb
          test -x /usr/bin/kege-station
          timeout 8 kege-station || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: KEGE_Station-Ubuntu-26.04
          path: dist/release/
          if-no-files-found: error
