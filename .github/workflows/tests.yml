name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q kege_app run.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify package tooling
        run: |
          python tools/build_package_example.py /tmp/kege-example.kege --password test-password
          python tools/validate_exam_package.py /tmp/kege-example.kege --password test-password --expect-variants 1 --expect-tasks 2 --strict
